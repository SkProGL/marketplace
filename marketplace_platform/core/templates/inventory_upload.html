    <div class="form">
      <h2>Add product</h2>

      <form>
        <label>Label</label>
        <input type="text" placeholder="Product label" />

        <label>Description</label>
        <textarea placeholder="Short product description"></textarea>

        <label>Allergens</label>
        <input type="text" placeholder="gluten, nuts" />

        <label>Price / Unit / Stock</label>
        <div class="row price-row">
          <input type="number" step="0.01" placeholder="Price $" />
          <input type="text" placeholder="Unit (kg/item)" />
          <input type="number" min="1" value="1" placeholder="Stock" />
        </div>

        <label>Food miles</label>
        <input type="number" min="1" value="1" />

        <label>Category</label>
        <div class="toggles">
          <input type="radio" name="cat" id="veg" checked /><label for="veg"
            >Vegetable</label
          >
          <input type="radio" name="cat" id="fruit" /><label for="fruit"
            >Fruit</label
          >
          <input type="radio" name="cat" id="dairy" /><label for="dairy"
            >Dairy</label
          >
          <input type="radio" name="cat" id="bakery" /><label for="bakery"
            >Bakery</label
          >
          <input type="radio" name="cat" id="preserve" /><label for="preserve"
            >Preserve</label
          >
        </div>

        <label>Season</label>
        <div class="toggles">
          <input type="radio" name="season" id="spring" checked /><label
            for="spring"
            >Spring</label
          >
          <input type="radio" name="season" id="summer" /><label for="summer"
            >Summer</label
          >
          <input type="radio" name="season" id="autumn" /><label for="autumn"
            >Autumn</label
          >
          <input type="radio" name="season" id="winter" /><label for="winter"
            >Winter</label
          >
        </div>

        <label>Options</label>
        <div class="toggles">
          <input type="checkbox" id="organic" /><label for="organic"
            >Organic</label
          >
          <input type="checkbox" id="surplus" /><label for="surplus"
            >Surplus</label
          >
        </div>

        <label>Image</label>
        <label class="upload">
          <input type="file" />
          Select image
        </label>

        <button>Upload Product</button>
      </form>

{% endblock %}
