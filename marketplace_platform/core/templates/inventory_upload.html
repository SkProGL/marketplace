{% extends "base.html" %}

{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'inventory_upload.css' %}">


    <div class="form">
      <h2>Add product</h2>
 <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <!-- Required hidden defaults -->
    <input type="hidden" name="availability" value="Available">
    <input type="hidden" name="seasonStart" value="January">
    <input type="hidden" name="seasonEnd" value="December">
    <input type="hidden" name="stock_alert_threshold" value="0">
    <input type="hidden" name="discount_percentage" value="0">
    <input type="hidden" name="best_before" value="2026-12-31">

    <label>Label</label>
    <input type="text" name="name" placeholder="Product label" required />

    <label>Description</label>
    <textarea name="description" placeholder="Short product description" required></textarea>

    <label>Allergens</label>
    <input type="text" name="allergens" placeholder="gluten,nuts" />

    <label>Price / Unit / Stock</label>
    <div class="row price-row">
      <input type="number" step="0.01" name="price" placeholder="Price $" required />
	<select name="unit" required>
	  <option value="kg">kg</option>
	  <option value="g">g</option>
	  <option value="l">l</option>
	  <option value="ml">ml</option>
	  <option value="pcs">pcs</option>
	  <option value="bunch">bunch</option>
	  <option value="heads">heads</option>
	  <option value="dozen">dozen</option>
	</select>
      <input type="number" name="stock" min="1" value="1" placeholder="Stock" required />
    </div>

    <label>Food miles</label>
    <input type="number" name="food_miles" min="1" value="1" required />

    <label>Category</label>
    <div class="toggles">
      <input type="radio" name="category" value="Vegetable" id="veg" checked />
      <label for="veg">Vegetable</label>

      <input type="radio" name="category" value="Fruit" id="fruit" />
      <label for="fruit">Fruit</label>

      <input type="radio" name="category" value="Dairy" id="dairy" />
      <label for="dairy">Dairy</label>

      <input type="radio" name="category" value="Bakery" id="bakery" />
      <label for="bakery">Bakery</label>

      <input type="radio" name="category" value="Preserve" id="preserve" />
      <label for="preserve">Preserve</label>
    </div>

    <!-- (UI only — backend uses hidden fields for now) -->
    <label>Season</label>
    <div class="toggles">
      <input type="radio" name="season_ui" id="spring" checked />
      <label for="spring">Spring</label>

      <input type="radio" name="season_ui" id="summer" />
      <label for="summer">Summer</label>

      <input type="radio" name="season_ui" id="autumn" />
      <label for="autumn">Autumn</label>

      <input type="radio" name="season_ui" id="winter" />
      <label for="winter">Winter</label>
    </div>

    <label>Options</label>
    <div class="toggles">
      <input type="checkbox" name="organic" id="organic" />
      <label for="organic">Organic</label>

      <input type="checkbox" name="surplus" id="surplus" />
      <label for="surplus">Surplus</label>
    </div>

    <label>Image</label>
    <label class="upload">
      <input type="file" name="image" />
      Select image
    </label>

    <button type="submit">Upload Product</button>
  </form>

{% endblock %}
