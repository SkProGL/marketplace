</div>

<style>
  * {
    font-family: monospace;
  }
  .food-miles-filter {
    display: inline-flex;
    align-items: center;
    gap: 1rem;
    margin-left: 2rem;
  }

  /* From Uiverse.io by Yaya12085 */
  .radio-input input {
    display: none;
  }

.radio-input label:nth-child(2) span::after {
    content: "";
  }

  .radio-input label:not(:nth-child(2)) span::after {
    content: " mi";
  }
  .radio-input {
    --container_width: 350px;
    --option_count: 3;
    position: relative;
    display: flex;
    align-items: center;
    border-radius: 9999px;
    background-color: #fff;
    color: #000000;
    width: var(--container_width);
    overflow: hidden;
    max-height: 30px;
    user-select: none;
    /* border: 1px solid rgba(53, 52, 52, 0.226); */

    /* box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); */
    box-shadow:
      1px 1px 2px -1px #fff inset,
      0 2px 1px #00000010,
      0 4px 2px #00000010,
      0 8px 4px #00000010,
      0 16px 8px #00000010,
      0 32px 16px #00000010;
  }

  .radio-input label {
    /* width: 100%; */
    flex: 1; /* evenly distributes space */
    min-width: 0; /* allows shrinking properly */
    padding: 10px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1;
    letter-spacing: 2px;
    font-size: 13px;
    white-space: nowrap;
  }

  .selection {
    display: none;
    position: absolute;
    height: 100%;
    width: calc(100% / var(--option_count));
    z-index: 0;
    left: 0;
    top: 0;
    transition: 0.15s ease;
  }

  .radio-input label:has(input:checked) {
    color: #fff;
  }

  .radio-input label:has(input:checked) ~ .selection {
    background-color: #00ac7c;
    display: inline-block;
  }

  .radio-input label:nth-child(1):has(input:checked) ~ .selection {
    transform: translateX(0%);
  }

  .radio-input label:nth-child(2):has(input:checked) ~ .selection {
    transform: translateX(100%);
  }

  .radio-input label:nth-child(3):has(input:checked) ~ .selection {
    transform: translateX(200%);
  }

  .input-alt,
  label {
    box-shadow:
      1px 1px 2px -1px #fff inset,
      0 2px 1px #00000010,
      0 4px 2px #00000010,
      0 8px 4px #00000010,
      0 16px 8px #00000010,
      0 32px 16px #00000010;
  }
</style>
