{% extends "base.html" %} {% load static %} {% block content %}
<link rel="stylesheet" href="{% static 'common.css' %}" />
<div class="widget-account-form-row justify-content-center">
<!-- From Uiverse.io by JkHuger -->
<div class="widget-account-form-container">
<div class="widget-account-form-card signup">
<!-- <a class="widget-account-form-signup">Sign Up</a> -->
<h2>SIGN UP</h2>
<div style="display:flex; gap:20px;">
<div style="gap:20px;">
<div class="widget-account-form-inputBox">
<input type="text" required="required" />
<span>Full name</span>
</div>
<div class="widget-account-form-inputBox1">
<input type="text" required="required" />
<span class="widget-account-form-user">Email</span>
</div>
<div class="widget-account-form-inputBox">
<input type="text" required="required" />
<span>Phone</span>
</div>
</div>
<div>
<div class="widget-account-form-inputBox right">
<input type="text" required="required" />
<span>Address (delivery): </span>
</div>
<div class="widget-account-form-inputBox right">
<input type="text" required="required" />
<span>Postcode</span>
</div>
<div class="widget-account-form-inputBox right" style="position: relative;">
<input type="password" required="required" id="signup-password" />
<span>Password</span>
<button type="button" onclick="togglePassword('signup-password', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 0; color: #888;">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
    </svg>
</button>
</div>
</div>
</div>
<!-- From Uiverse.io by boryanakrasteva --> 
<div class="widget-sign-checkbox-wrapper">
<input type="checkbox" class="widget-sign-check" id="check1-61" />
<label for="check1-61" class="widget-sign-label">
<svg width="45" height="45" viewBox="0 0 95 95">
<rect
x="30"
y="20"
width="50"
height="50"
stroke="black"
fill="none"
></rect>
<g transform="translate(0,-952.36222)">
<path
d="m 56,963 c -102,122 6,9 7,9 17,-5 -66,69 -38,52 122,-77 -7,14 18,4 29,-11 45,-43 23,-4"
stroke="#cc2323"
stroke-width="3"
fill="none"
class="widget-sign-path1"
></path>
</g>
</svg>
<span>Accept terms, conditions &amp; cookie policy</span>
</label>
</div>
<button class="widget-account-form-enter">Enter</button>
</div>
</div>
</div>

<script>
function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    btn.innerHTML = isHidden
        ? `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`
        : `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
}
</script>
{% endblock %}
