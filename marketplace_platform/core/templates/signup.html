{% extends "base.html" %} {% load static %} {% block content %}

<link rel="stylesheet" href="{% static 'common.css' %}" />
<div class="widget-account-form-row justify-content-center">
  <!-- From Uiverse.io by JkHuger -->
  <div class="widget-account-form-container">
    <div class="widget-account-form-card signup">
      <!-- <a class="widget-account-form-signup">Sign Up</a> -->
      <h2>SIGN UP</h2>

      <div style="display:flex; gap:20px;">
	      <div style="gap:20px;">
		      <div class="widget-account-form-inputBox">
			<input type="text" required="required" />
			<span>Full name</span>
		      </div>

		      <div class="widget-account-form-inputBox1">
			<input type="text" required="required" />
			<span class="widget-account-form-user">Email</span>
		      </div>

		      <div class="widget-account-form-inputBox">
			<input type="text" required="required" />
			<span>Phone</span>
		      </div>

	      </div>
	      <div>
		      <div class="widget-account-form-inputBox right">
			<input type="text" required="required" />
			<span>Address (delivery): </span>
		      </div>
		      <div class="widget-account-form-inputBox right">
			<input type="text" required="required" />
			<span>Postcode</span>
		      </div>
		      <div class="widget-account-form-inputBox right">
			<input type="password" required="required" />
			<span>Password</span>
		      </div>

	      </div>
      </div>
	<!-- From Uiverse.io by boryanakrasteva --> 
	<div class="widget-sign-checkbox-wrapper">
	  <input type="checkbox" class="widget-sign-check" id="check1-61" />
	  <label for="check1-61" class="widget-sign-label">
	    <svg width="45" height="45" viewBox="0 0 95 95">
	      <rect
		x="30"
		y="20"
		width="50"
		height="50"
		stroke="black"
		fill="none"
	      ></rect>
	      <g transform="translate(0,-952.36222)">
		<path
		  d="m 56,963 c -102,122 6,9 7,9 17,-5 -66,69 -38,52 122,-77 -7,14 18,4 29,-11 45,-43 23,-4"
		  stroke="#cc2323"
		  stroke-width="3"
		  fill="none"
		  class="widget-sign-path1"
		></path>
	      </g>
	    </svg>
	    <span>Accept terms, conditions &amp; cookie policy</span>
	  </label>
	</div>
      <button class="widget-account-form-enter">Enter</button>
    </div>
  </div>
</div>
{% endblock %}
