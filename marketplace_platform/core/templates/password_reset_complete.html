{% extends "base.html" %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'common.css' %}">
<link rel="stylesheet" href="{% static 'login.css' %}">
<div class="row justify-content-center">
  <div class="widget-account-form-container">
    <div class="widget-account-form-card" style="text-align:center;">
      <div style="font-size:2.5rem;color:#198754;margin-bottom:0.5rem;">✓</div>
      <h2>Password updated</h2>
      <p style="font-size:0.9rem;color:#555;margin:1rem 0;">Your password has been set. You can now log in.</p>
      <a href="{% url 'login' %}" class="widget-account-form-enter" style="display:inline-block;text-decoration:none;">Log in</a>
    </div>
  </div>
</div>
{% endblock %}
