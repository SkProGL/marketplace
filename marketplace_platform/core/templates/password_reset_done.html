{% extends "base.html" %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'common.css' %}">
<link rel="stylesheet" href="{% static 'login.css' %}">
<div class="row justify-content-center">
  <div class="widget-account-form-container">
    <div class="widget-account-form-card" style="text-align:center;">
      <div style="font-size:2.5rem;color:#198754;margin-bottom:0.5rem;">✉</div>
      <h2>Check your email</h2>
      <p style="font-size:0.9rem;color:#555;margin:1rem 0;">
        If an account exists for that address, a password reset link has been sent.<br>
        <span style="font-size:0.82rem;color:#aaa;">During development the link appears in the Docker logs.</span>
      </p>
      <a href="{% url 'login' %}" style="color:#198754;font-size:0.88rem;">Back to login</a>
    </div>
  </div>
</div>
{% endblock %}
