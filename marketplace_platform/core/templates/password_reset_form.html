{% extends "base.html" %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'common.css' %}">
<link rel="stylesheet" href="{% static 'login.css' %}">
<div class="row justify-content-center">
  <form method="POST">
    {% csrf_token %}
    <div class="widget-account-form-container">
      <div class="widget-account-form-card">
        <h2>Reset Password</h2>
        <p style="font-size:0.88rem;color:#888;margin-bottom:1.2rem;">Enter your account email and we'll send you a reset link.</p>

        <div class="widget-account-form-inputBox">
          <input type="email" name="email" required autofocus>
          <span class="widget-account-form-user">Email</span>
        </div>

        <br>
        <button type="submit" class="widget-account-form-enter">Send reset link</button>
        <div style="margin-top:1rem;text-align:center;font-size:0.88rem;">
          <a href="{% url 'login' %}" style="color:#198754;">Back to login</a>
        </div>
      </div>
    </div>
  </form>
</div>
{% endblock %}
