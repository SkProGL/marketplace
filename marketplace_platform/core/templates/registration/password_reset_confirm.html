{% extends "base.html" %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'login.css' %}">
<div class="row justify-content-center">
<form method="POST">
    {% csrf_token %}
    <div class="widget-account-form-container">
        <div class="widget-account-form-card">
            <h2>NEW PASSWORD</h2>
            {% if validlink %}
                {% if form.errors %}
                    <div class="alert alert-danger">{{ form.errors }}</div>
                {% endif %}
                <div class="widget-account-form-inputBox">
                    <input type="password" name="new_password1" required>
                    <span>New password</span>
                </div>
                <div class="widget-account-form-inputBox">
                    <input type="password" name="new_password2" required>
                    <span>Confirm password</span>
                </div>
                <br>
                <button type="submit" class="widget-account-form-enter">Set new password</button>
            {% else %}
                <p style="color:#dc3545;">This reset link is invalid or has expired.</p>
                <a href="{% url 'password_reset' %}" class="widget-account-form-enter" style="display:block; text-align:center; text-decoration:none;">Request a new link</a>
            {% endif %}
        </div>
    </div>
</form>
</div>
{% endblock %}
