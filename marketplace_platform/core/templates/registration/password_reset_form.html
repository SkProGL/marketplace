{% extends "base.html" %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'login.css' %}">
<div class="row justify-content-center">
<form method="POST">
    {% csrf_token %}
    <div class="widget-account-form-container">
        <div class="widget-account-form-card">
            <h2>RESET PASSWORD</h2>
            <p style="font-size:0.9em; color:#555; margin-bottom:1.2rem;">
                Enter your email address and we'll send you a link to reset your password.
            </p>
            {% if form.errors %}
                <div class="alert alert-danger">{{ form.errors }}</div>
            {% endif %}
            <div class="widget-account-form-inputBox">
                <input type="email" name="email" required>
                <span class="widget-account-form-user">Email</span>
            </div>
            <br>
            <button type="submit" class="widget-account-form-enter">Send reset link</button>
            <div style="text-align:center; margin-top:1rem;">
                <a href="{% url 'login' %}" style="font-size:0.9em; color:#198754;">Back to login</a>
            </div>
        </div>
    </div>
</form>
</div>
{% endblock %}
