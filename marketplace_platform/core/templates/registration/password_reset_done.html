{% extends "base.html" %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'login.css' %}">
<div class="row justify-content-center">
    <div class="widget-account-form-container">
        <div class="widget-account-form-card">
            <h2>CHECK YOUR EMAIL</h2>
            <p style="font-size:0.9em; color:#555; margin-bottom:1.2rem;">
                If an account exists for that address, we've sent a password reset link. Check your inbox (and spam folder).
            </p>
            <a href="{% url 'login' %}" class="widget-account-form-enter" style="display:block; text-align:center; text-decoration:none;">Back to login</a>
        </div>
    </div>
</div>
{% endblock %}
