{% extends "base.html" %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'community.css' %}">

<div class="ch-header">
    <h1>Add Farm Story</h1>
    <p>Share a story, storage guidance or update from your farm</p>
</div>

<div class="ch-form-container">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="ch-form-row">
            <label>Story Content</label>
            {{ form.content }}
        </div>
        <div class="ch-form-row">
            <label>Image (optional)</label>
            {{ form.image }}
        </div>
        <div class="ch-form-actions">
            <a href="{% url 'community' %}" class="ch-btn-outline">Cancel</a>
            <button type="submit" class="ch-btn-primary">Publish Story</button>
        </div>
    </form>
</div>
{% endblock %}
