{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card p-4 shadow">
            <h3>Sign In</h3>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}  <button type="submit" class="btn btn-primary w-100">Enter</button>
            </form>
            <div class="d-grid mt-2">
            <a href="{% url 'home' %}" class="btn btn-outline-secondary">Back to Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
