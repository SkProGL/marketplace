{% extends "base.html" %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="{% static 'common.css' %}">
<link rel="stylesheet" href="{% static 'login.css' %}">
<div class="row justify-content-center">
{% if form.errors %}
  <div class="alert alert-danger">
    {{ form.errors }}
  </div>
{% endif %}
<form method="POST">
    {% csrf_token %}

    <div class="widget-account-form-container">
        <div class="widget-account-form-card">
            <h2>LOG IN</h2>

            <div class="widget-account-form-inputBox">
                <input type="email" name="email" required >
                <span class="widget-account-form-user">Email</span>
            </div>

            <div class="widget-account-form-inputBox">
                <input type="password" name="password" required>
                <span >Password</span>

<button type="button" class="password-toggle" aria-label="Show password" onclick="const i=this.parentElement.querySelector('[name=password]'); i.type = i.type === 'password' ? 'text' : 'password'; this.textContent = i.type === 'password' ? 'show' : 'hide'">show</button>
            </div>
            
            <div style="text-align: left; margin-bottom: 15px; margin-top: 10px;">
                <input type="checkbox" name="remember_me" id="remember_me">
                <label for="remember_me" style="font-size: 0.9em; color: #555;">Remember me</label>
            </div>
	    <br>

            <button type="submit" class="widget-account-form-enter">
                Enter
            </button>
            <!-- [DEV] Quick login buttons for different user types-->     
             <hr>
             [DEV] Quick-login
            <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:4px">
                <button type="button" onclick="document.querySelector('[name=email]').value='root@example.com'; document.querySelector('[name=password]').value='Password123'; this.closest('form').submit();">superuser</button>
                <button type="button" onclick="document.querySelector('[name=email]').value='producer@example.com'; document.querySelector('[name=password]').value='Password123'; this.closest('form').submit();">producer</button>
                <button type="button" onclick="document.querySelector('[name=email]').value='restaurant@example.com'; document.querySelector('[name=password]').value='Password123'; this.closest('form').submit();">restaurant</button>
                <button type="button" onclick="document.querySelector('[name=email]').value='community@example.com'; document.querySelector('[name=password]').value='Password123'; this.closest('form').submit();">community</button>
                <button type="button" onclick="document.querySelector('[name=email]').value='customer@example.com'; document.querySelector('[name=password]').value='Password123'; this.closest('form').submit();">customer</button>
            </div>
            <!--  -->
        </div>
    </div>
</form>


</div>
{% endblock %}
