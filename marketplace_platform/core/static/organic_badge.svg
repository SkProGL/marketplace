<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <path id="topArc"    d="M 17,50 A 33,33 0 0 1 83,50"/>
    <path id="bottomArc" d="M 17,50 A 33,33 0 0 0 83,50"/>
  </defs>

  <!-- Scalloped seal background -->
  <polygon fill="#5cb85c" points="
    50,3 57.3,8.6 66.1,5.8 71,13.6 80.2,14 82.2,23 90.7,26.5 89.5,35.6
    96.3,41.8 92,50 96.3,58.2 89.5,64.4 90.7,73.5 82.2,77 80.2,86 71,86.4
    66.1,94.2 57.3,91.4 50,97 42.7,91.4 33.9,94.2 29,86.4 19.8,86 17.8,77
    9.3,73.5 10.5,64.4 3.7,58.2 8,50 3.7,41.8 10.5,35.6 9.3,26.5 17.8,23
    19.8,14 29,13.6 33.9,5.8 42.7,8.6"/>

  <!-- Outer ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="white" stroke-width="1.5"/>
  <!-- Inner ring -->
  <circle cx="50" cy="50" r="33" fill="none" stroke="white" stroke-width="1"/>

  <!-- Side dots (between rings at 9 o'clock and 3 o'clock) -->
  <circle cx="14" cy="47" r="1.2" fill="white"/>
  <circle cx="14" cy="50" r="1.2" fill="white"/>
  <circle cx="14" cy="53" r="1.2" fill="white"/>
  <circle cx="86" cy="47" r="1.2" fill="white"/>
  <circle cx="86" cy="50" r="1.2" fill="white"/>
  <circle cx="86" cy="53" r="1.2" fill="white"/>

  <!-- Big leaf (left, pointing up) -->
  <path d="M 47,59 C 33,56 27,40 34,29 C 39,21 53,25 53,39 C 53,51 47,59 47,59 Z" fill="white"/>
  <!-- Big leaf vein -->
  <path d="M 47,59 C 43,48 37,37 34,29" fill="none" stroke="#5cb85c" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Small leaf (right, pointing up-right) -->
  <path d="M 47,59 C 55,52 65,53 64,60 C 63,67 49,67 47,59 Z" fill="white"/>
  <!-- Small leaf vein -->
  <path d="M 47,59 C 54,57 61,56 64,60" fill="none" stroke="#5cb85c" stroke-width="0.9" stroke-linecap="round"/>

  <!-- ORGANIC text along top arc -->
  <text font-size="9" font-weight="bold" fill="white" font-family="Arial,sans-serif" letter-spacing="2.5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">ORGANIC</textPath>
  </text>

  <!-- PRODUCT text along bottom arc -->
  <text font-size="9" font-weight="bold" fill="white" font-family="Arial,sans-serif" letter-spacing="2.5">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">PRODUCT</textPath>
  </text>
</svg>
