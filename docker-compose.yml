services:
  db:
    image: postgres:17
    container_name: postgres_db
    # restart: always
    # environment reads .env file for authentication data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    # TLDR checks whether DB has started all of it's services and is ready to accept connections
    # if fails after 5 tries container will terminate
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  web:
    build: . # build in current directory
    container_name: django_app
    command: uv run python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./marketplace_platform:/app
    ports:
      - "8000:8000"
    environment:
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - .env

  # Periodicly (hour) marks stock as surplus
  scheduler:
    build: .
    command: >
      sh -c 'while true; do
        uv run python manage.py auto_surplus;
        sleep 3600;
      done'
    volumes:
      - ./marketplace_platform:/app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  # Synthetic ActivityLog generator — backfills a week of history on startup,
  # then streams new events so the /activity/ dashboard stays lively.
  # Writes directly via the ORM, so it only needs the DB (not `web`).
  traffic_simulator:
    build: .
    command: ["sh", "-c", "sleep 10 && uv run python manage.py simulate_traffic --backfill 800 --rate 1.0 --anon-ratio 0.35"]
    volumes:
      - ./marketplace_platform:/app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  # AI Service
  ai-service:
    build:
      context: ./aai_service/ai-marketplace-scaffold/ai-service
      dockerfile: Dockerfile
    container_name: ai-service
    command: python app.py
    ports:
      - "8001:8000"
    environment:
      MODELS_DIR: /app/models
      MODEL_REGISTRY_PATH: /app/models/model_registry.json
      ACTIVE_MODEL_NAME: tiny-iris-logreg.joblib
      USE_FILE_MODELS: "true"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /aai_service:/aai_service/task_2
      # DB access for the demand-forecast trainer/predictor
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./aai_service/ai-marketplace-scaffold/models:/app/models
      - ./aai_service:/aai_service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # AI Service dashboard
  ai-web-app:
    build:
      context: ./aai_service/ai-marketplace-scaffold/web-app
      dockerfile: Dockerfile
    container_name: ai-web-app
    command: flask run --host=0.0.0.0 --port=5000 --reload
    ports:
      - "5000:5000"
    environment:
      FLASK_APP: app.py
      FLASK_DEBUG: "1"
      AI_SERVICE_URL: http://ai-service:8000
      PYTHONUNBUFFERED: "1"
    depends_on:
      ai-service:
        condition: service_healthy
    volumes:
    - ./aai_service/ai-marketplace-scaffold/web-app:/app
volumes:
  postgres_db:
